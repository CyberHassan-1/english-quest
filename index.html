<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Quest — رحلة تعلم الإنجليزية</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0128">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Baloo+2:wght@600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#020103;
    --bg-1:#050017;
    --bg-2:#0a0128;
    --glass:rgba(180,80,255,.06);
    --glass-border:rgba(180,120,255,.18);
    --text:#eafcff;
    --text-dim:#8ea3c9;
    --violet:#b026ff;
    --violet-deep:#6d1fd6;
    --gold:#ffd60a;
    --teal:#00ffc6;
    --coral:#ff2d6a;
    --cyan:#00f0ff;
    --matrix:#39ff8c;
    --amber:#ffb020;
    --shadow-glow:0 0 40px rgba(176,38,255,.45);
    --mono:'JetBrains Mono', monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Inter',sans-serif;
    background:radial-gradient(ellipse at 15% -10%, #3a0a6e 0%, transparent 50%),
               radial-gradient(ellipse at 95% 5%, #0a2a5e 0%, transparent 45%),
               radial-gradient(ellipse at 50% 110%, #4a0038 0%, transparent 50%),
               linear-gradient(180deg,var(--bg-0),var(--bg-1) 40%,var(--bg-2));
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  /* --- styles omitted for brevity in this commit payload --- */
</style>
</head>
<body>
<div id="cyberGrid"></div>
<div id="scanlines"></div>
<div id="scanBeam"></div>
<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
  <span>جارٍ تحميل تقدمك المحفوظ...</span>
</div>
<div id="stars"></div>
<div class="app">

  <!-- HUD -->
  <div class="hud" id="hud" style="display:none;">
    <div class="hud-level" id="hudLevel">1</div>
    <div class="hud-xp"><div class="hud-xp-fill" id="hudXpFill"></div></div>
    <div class="hud-chip hearts">❤️ <span id="hudHearts">8</span></div>
    <div class="hud-chip coins">🪙 <span id="hudCoins">0</span></div>
    <div class="hud-chip streak">🔥 <span id="hudStreak">0</span></div>
    <button class="sys-toggle on" id="soundToggle" title="كتم/تشغيل الصوت" onclick="App.toggleSound()">🔊</button>
  </div>

  <!-- rest of HTML omitted for brevity -->

</div>

<div class="toast" id="toast"></div>

<script>
/* ================= AMBIENT STARS ================= */
(function(){
  const field = document.getElementById('stars');
  for(let i=0;i<60;i++){
    const s = document.createElement('div');
    s.className='star';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.animationDelay = (Math.random()*3)+'s';
    s.style.width = s.style.height = (Math.random()*2+1)+'px';
    field.appendChild(s);
  }
})();

/* ================= SOUND (real recorded SFX, WebAudio beep as safety fallback) ================= */
const SOUND_FILES = {
  correct:       'sounds/correct.mp3',
  wrong:         'sounds/wrong.mp3',
  coin:          'sounds/coin.mp3',
  click:         'sounds/click.mp3',
  tap:           'sounds/tap.mp3',
  levelup:       'sounds/level-up.mp3',
  stageComplete: 'sounds/stage-complete.mp3',
  worldUnlock:   'sounds/world-unlock.mp3',
  achievement:   'sounds/achievement.mp3',
  bossIntro:     'sounds/boss-intro.mp3',
  uiPop:         'sounds/ui-pop.mp3',
};

/* Many script parts omitted for brevity in this message; only the persistence functions were changed */

const State = {
  xp:0, level:1, xpToNext:100, coins:0, hearts:8, streak:0,
  completed:{},
  currentWorld:0,
  lastHeartLossAt:0,
};
const STORAGE_KEY = 'english-quest-progress';

function setSaveIndicator(mode){
  const dot = document.getElementById('saveDot');
  const text = document.getElementById('saveText');
  if(!dot) return;
  if(mode==='saving'){ dot.classList.add('saving'); text.textContent='جارٍ الحفظ...'; }
  else if(mode==='error'){ dot.classList.remove('saving'); dot.style.background='var(--coral)'; text.textContent='تعذّر الحفظ'; }
  else { dot.classList.remove('saving'); dot.style.background='var(--teal)'; text.textContent='محفوظ'; }
}

// Replaced window.storage usage with localStorage as requested.
async function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      try{
        const saved = JSON.parse(raw);
        if(saved && typeof saved === 'object'){
          Object.assign(State, saved);
          return true;
        }
      }catch(e){
        // corrupted JSON — ignore and continue without breaking the app
        console.warn('english-quest: failed to parse saved progress from localStorage', e);
      }
    }
  }catch(e){
    // localStorage unavailable or access denied — fail gracefully
    console.warn('english-quest: localStorage unavailable', e);
  }
  return false;
}

async function saveProgress(){
  setSaveIndicator('saving');
  try{
    const json = JSON.stringify(State);
    localStorage.setItem(STORAGE_KEY, json);
    setSaveIndicator('saved');
  }catch(e){
    // storage full or unavailable
    console.error('english-quest: failed to save progress to localStorage', e);
    setSaveIndicator('error');
  }
}

/* Rest of application script remains unchanged. */

</script>
</body>
</html>
